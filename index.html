<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income Expense Calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="max-w-4xl mx-auto p-4">

        <h1 class="text-3xl font-bold text-center mb-5">
            Income Expense Calculator
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">

            <div class="bg-white p-5 rounded shadow text-center">
                <p class="text-gray-500">Total Income</p>
                <h2 class="text-2xl font-bold text-green-600">
                    ₹<span id="income">0</span>
                </h2>
            </div>

            <div class="bg-white p-5 rounded shadow text-center">
                <p class="text-gray-500">Total Expense</p>
                <h2 class="text-2xl font-bold text-red-600">
                    ₹<span id="expense">0</span>
                </h2>
            </div>

            <div class="bg-white p-5 rounded shadow text-center">
                <p class="text-gray-500">Balance</p>
                <h2 id="balanceText" class="text-2xl font-bold text-blue-600">
                    ₹<span id="balance">0</span>
                </h2>
            </div>

        </div>

        <div class="bg-white p-5 rounded shadow mb-5">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                <input type="text" id="desc" placeholder="Enter description" class="border p-2 rounded w-full"
                    onkeypress="handleEnter(event)">

                <input type="number" id="amount" placeholder="Enter amount" class="border p-2 rounded w-full"
                    onkeypress="handleEnter(event)">

                <select id="type" class="border p-2 rounded w-full">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <select id="category" class="border p-2 rounded w-full">
                    <option value="Salary">Salary</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                </select>

            </div>

            <p id="error" class="text-red-500 text-sm mt-2"></p>

            <div class="flex gap-3 mt-4">

                <button onclick="addOrUpdate()"
                    class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded w-full">
                    Add / Update
                </button>

                <button onclick="resetForm()" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded w-full">
                    Reset
                </button>

            </div>

        </div>

        <div class="mb-5">
            <input type="text" id="search" placeholder="Search transaction..." class="border p-2 rounded w-full"
                onkeyup="render()">
        </div>

        <div class="flex gap-5 mb-5">

            <label>
                <input type="radio" name="filter" value="all" checked>
                All
            </label>

            <label>
                <input type="radio" name="filter" value="income">
                Income
            </label>

            <label>
                <input type="radio" name="filter" value="expense">
                Expense
            </label>

        </div>

        <div id="list" class="space-y-3"></div>
    </div>

    <script>

        let data = JSON.parse(localStorage.getItem("transactions")) || [];

        let editId = null;

        function saveData() {
            try {
                localStorage.setItem("transactions", JSON.stringify(data));
            } catch (e) {
                alert("Storage error");
            }
        }

        function render() {

            const list = document.getElementById("list");
            list.innerHTML = "";

            let income = 0;
            let expense = 0;

            data.forEach(item => {
                if (item.type === "income") {
                    income += Number(item.amount);
                } else {
                    expense += Number(item.amount);
                }
            });

            const filter =
                document.querySelector('input[name="filter"]:checked').value;

            const search =
                document.getElementById("search").value.toLowerCase();

            let filteredData = data.filter(item => {

                let matchFilter =
                    filter === "all" || item.type === filter;

                let matchSearch =
                    item.desc.toLowerCase().includes(search) ||
                    item.category.toLowerCase().includes(search);

                return matchFilter && matchSearch;
            });

            if (filteredData.length === 0) {

                list.innerHTML = `
                    <div class="bg-white p-5 rounded shadow text-center text-gray-500">
                        📭 No Transactions Found
                    </div>
                `;
            }

            filteredData.forEach(item => {

                const div = document.createElement("div");

                div.className =
                    "bg-white p-4 rounded shadow flex justify-between items-center";

                div.innerHTML = `
                
                    <div>
                        <h2 class="font-bold text-lg">
                            ${item.desc}
                        </h2>

                        <p class="text-sm text-gray-500">
                            ${item.category}
                        </p>

                        <p class="text-xs text-gray-400">
                            ${item.date}
                        </p>
                    </div>

                    <div class="text-right">

                        <p class="${item.type === "income"
                        ? "text-green-600"
                        : "text-red-600"
                    } font-bold text-lg">

                            ₹${item.amount}

                        </p>

                        <div class="flex gap-2 mt-2">

                            <button
                                onclick="editItem('${item.id}')"
                                class="bg-yellow-400 px-3 py-1 rounded">
                                Edit
                            </button>

                            <button
                                onclick="deleteItem('${item.id}')"
                                class="bg-red-500 text-white px-3 py-1 rounded">
                                Delete
                            </button>

                        </div>

                    </div>
                `;

                list.appendChild(div);

            });

            document.getElementById("income").innerText = income;
            document.getElementById("expense").innerText = expense;

            const balance = income - expense;
            document.getElementById("balance").innerText = balance;

            const balanceText = document.getElementById("balanceText");

            if (balance < 0) {
                balanceText.classList.add("text-red-600");
                balanceText.classList.remove("text-blue-600");
            } else {
                balanceText.classList.add("text-blue-600");
                balanceText.classList.remove("text-red-600");
            }
        }

        function addOrUpdate() {
            const desc =
                document.getElementById("desc").value.trim();

            const amount =
                document.getElementById("amount").value;

            const type =
                document.getElementById("type").value;

            const category =
                document.getElementById("category").value;

            const errorEl = document.getElementById("error");

            if (!desc || !amount) {
                errorEl.innerText = "Please fill all fields";
                return;
            } else {
                errorEl.innerText = "";
            }

            if (amount <= 0) {
                errorEl.innerText = "Amount must be greater than 0";
                return;
            }

            if (editId) {
                const confirmEdit = confirm("Update this transaction?");
                if (!confirmEdit) return;
            }

            const transaction = {

                id: editId || Date.now(),
                desc: desc,
                amount: amount,
                type: type,
                category: category,
                date: new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString()
            };
            if (editId) {

                data = data.map(item => {
                    if (item.id == editId) {
                        return transaction;
                    } else {
                        return item;
                    }
                });

                editId = null;
                alert("Updated successfully");

            } else {

                data.push(transaction);
                alert("Added successfully");
            }

            saveData();
            render();
            resetForm();
        }

        function editItem(id) {

            const item =
                data.find(transaction => transaction.id == id);

            document.getElementById("desc").value = item.desc;
            document.getElementById("amount").value = item.amount;
            document.getElementById("type").value = item.type;
            document.getElementById("category").value = item.category;

            editId = id;
        }
        function deleteItem(id) {

            const confirmDelete =
                confirm("Are you sure you want to delete?");

            if (!confirmDelete) return;

            data = data.filter(item => item.id != id);

            saveData();
            render();
        }
        function resetForm() {

            document.getElementById("desc").value = "";
            document.getElementById("amount").value = "";
            document.getElementById("type").value = "income";
            document.getElementById("category").value = "Salary";
            document.getElementById("error").innerText = "";

            editId = null;
        }
        function handleEnter(e) {
            if (e.key === "Enter") {
                addOrUpdate();
            }
        }

        document
            .querySelectorAll('input[name="filter"]')
            .forEach(radio => {
                radio.addEventListener("change", render);
            });

        render();

    </script>

</body>

</html>
